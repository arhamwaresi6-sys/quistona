<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questona - Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='css/base.css')}}"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='css/auth.css')}}"
    />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="container nav-inner">
        <a href="/" class="logo"><span class="logo-mark">Q</span> Questona</a>
        <button class="menu-btn" id="menuBtn">&#9776;</button>
        <nav class="nav-links" id="navLinks">
          <a href="/">Home</a>
          <a href="/batches">Batches</a>
          <a href="{{ url_for('main.users') }}" class="active">Community</a>
          <a href="/register" class="btn btn-small">Login / Sign up</a>
        </nav>
      </div>
    </header>

    <main class="container auth-wrap">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to add and manage questions.</p>

        <!-- Flask: action="/login" -->
        <form action="/login" method="post">
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              class="input"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-box">
              <input
                type="password"
                class="input"
                id="password"
                name="password"
                placeholder="Your password"
                required
              />
              <button
                type="button"
                class="show-btn"
                data-toggle-password="password"
              >
                Show
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-block">Log in</button>
          {%if error%}
          <div class="error-message">
            <span class="error-icon">!</span>
            <p>{{error}}</p>
          </div>

          {%endif%}
        </form>

        <p class="switch">
          New here? <a href="/register">Create an account</a>
        </p>
      </div>
    </main>

    <script src="{{url_for('static',filename='js/main.js')}}"></script>
  </body>
</html>
